<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&display=block" rel="stylesheet">
<style>
  html, body { margin:0; width:1024px; height:500px; overflow:hidden; }
  body { font-family:"Baloo Bhaijaan 2", "SF Arabic Rounded", sans-serif; }

</style>

  <circle cx="955" cy="72" r="40" fill="#F5B731"/>

  <circle cx="210" cy="235" r="170" fill="url(#glow)"/>
  <g transform="translate(210 235) scale(.52) translate(-512 -480)">
    <circle cx="512" cy="190" r="32" fill="none" stroke="#C47A12" stroke-width="14"/>
    <path d="M512 222 L622 308 L402 308 Z" fill="#E09A1E"/>
    <rect x="387" y="304" width="250" height="44" rx="22" fill="#C47A12"/>

  <path d="M0 418 C 220 380, 420 392, 560 414 S 860 440, 1024 392 L1024 500 L0 500 Z" fill="#0E7C74"/>

  <text x="930" y="215" text-anchor="start" direction="rtl" font-size="92" font-weight="800" fill="#FFFFFF">أحاديث الصغار</text>
  <text x="930" y="285" text-anchor="start" direction="rtl" font-size="38" font-weight="600" fill="#FFE7A3">احفظ الأحاديث بالحكايات والألعاب ⭐</text>
