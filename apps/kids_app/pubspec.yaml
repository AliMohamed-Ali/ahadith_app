name: kids_app
description: أحاديث الصغار — أبلكيشن الأطفال.
version: 1.0.0+2
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hadith_core:
    path: ../../packages/hadith_core
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  share_plus: ^10.1.1
  just_audio: ^0.9.42
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/scenes/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  # Android 8+: الصورة كاملة خلفية، والـ launcher بيقصّها دايرة أو مربع حسب الموبايل.
  adaptive_icon_background: assets/icon/app_icon.png
  adaptive_icon_foreground: assets/icon/transparent.png
