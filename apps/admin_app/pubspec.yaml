name: admin_app
description: لوحة تحكم «أحاديث الصغار» — إدارة المحتوى والجوائز والإشعارات.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hadith_core:
    path: ../../packages/hadith_core
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  dio: ^5.7.0
  cloud_functions: ^5.1.4
  provider: ^6.1.2
  file_picker: ^8.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed_content.json
    # صحيح البخاري متجهز للأطفال (tools/bukhari/build_bukhari.py)
    - assets/bukhari_kids.json
